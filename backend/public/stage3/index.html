<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOST_SHELL // Stage 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crt-overlay"></div>
    <div class="main-container">
        <div class="terminal-window" onclick="document.getElementById('cmd-input').focus()">
            <div id="terminal-output"></div>
            <div class="input-line">
                <span class="prompt" id="prompt-text">operator@ghost-shell:/$</span>
                <input type="text" id="cmd-input" autocomplete="off" autofocus spellcheck="false" />
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
