<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOST_SHELL // TERMINAL LOGIN</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #060809;
            color: #33ff33;
            font-family: "Courier New", Consolas, monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            border: 1px solid #1f3a24;
            padding: 40px;
            box-shadow: 0 0 25px rgba(51, 255, 51, 0.12);
            background-color: #0b0e11;
            width: 400px;
            text-align: center;
        }
        h1 {
            font-size: 1.2rem;
            border-bottom: 1px dashed #2b5c34;
            padding-bottom: 10px;
            margin-bottom: 30px;
            color: #88cc88;
        }
        .group-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background: transparent;
            border: 1px solid #33ff33;
            color: #33ff33;
            font-family: inherit;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .group-btn:hover {
            background-color: rgba(51, 255, 51, 0.15);
            box-shadow: 0 0 10px rgba(51, 255, 51, 0.3);
        }
        .group-btn::before {
            content: '> ';
            color: #88a088;
        }
        .warning {
            color: #ffaa00;
            font-size: 0.85rem;
            margin-top: 20px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>/// SYSTEM ACCESS ///</h1>
        <div style="margin-bottom: 20px; text-align: left; color: #88a088;">
            SELECT YOUR NODE IDENTIFIER:
        </div>
        
        <button class="group-btn" onclick="selectGroup('0')">GROUP 0</button>
        <button class="group-btn" onclick="selectGroup('1')">GROUP 1</button>
        <button class="group-btn" onclick="selectGroup('2')">GROUP 2</button>

        <div class="warning">
            WARNING: IDENTITY IS BINDING.<br>
            ONCE LOGGED IN, YOUR PROGRESS WILL BE SYNCED TO THIS GROUP.
        </div>
    </div>

    <script>
        sessionStorage.setItem('active_stage_url', window.location.pathname); 
        // 檢查是否已經登入過
        window.onload = async () => {
            try {
                const res = await fetch('/api/frontend/api/me');
                if (res.ok) {
                    // 已經有 Cookie，直接去檢查頁
                    window.location.href = '/api/frontend/verify/';
                }
            } catch (e) {}
        };

        async function selectGroup(groupId) {
            try {
                const res = await fetch('/api/frontend/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ groupId })
                });
                
                if (res.ok) {
                    // 登入成功，後端已發 Cookie，前往檢查頁
                    window.location.href = '/api/frontend/verify/';
                } else {
                    alert('登入失敗');
                }
            } catch (err) {
                alert('無法連線到伺服器');
            }
        }
    </script>
</body>
</html>
