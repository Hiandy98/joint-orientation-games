services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: joint-orientation-games-backend
    restart: always
    ports:
      - "3000:3000"
    expose:
      - "3000"
    env_file:
      - .env
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - DB_HOST=db
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - joint-orientation-games-network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: joint-orientation-games-database
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=512MB
    ports:
      - "${DB_PORT}:5432"
    networks:
      - joint-orientation-games-network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  joint-orientation-games-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
